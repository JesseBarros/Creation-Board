<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP restritiva: sem scripts remotos, sem eval. `ws:` e `http://localhost:*`
      existem so para o HMR do Vite em desenvolvimento; no build empacotado nao
      ha nada escutando nesses enderecos.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: http://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creation Board</title>
    <!--
      A tela de abertura mora AQUI, e nao num modulo, porque ela precisa estar
      pintada no primeiro frame -- antes de qualquer CSS ou JavaScript carregar.
      Montada por script, ela apareceria depois do momento em que serve.

      O fundo escuro nao e escolha de tema: e a mesma cor do `backgroundColor` da
      janela (main/index.ts) e do fundo da propria logo. Os tres iguais fazem a
      janela abrir sem nenhuma troca de cor ate o app assumir.

      Quem a remove e o `bootScreen.ts`, quando a biblioteca esta listada.
    -->
    <style>
      #qb-boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        /*
          A cor exata do fundo da logo (medido: rgb(6,9,18)), e nao a do tema
          escuro. O arquivo e OPACO -- nao tem alfa --, entao qualquer outra cor
          aqui deixaria o retangulo dele aparecendo como uma mancha. A mesma cor
          esta no `backgroundColor` da janela, em main/index.ts.
        */
        background: #060912;
        transition: opacity 260ms ease;
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      }
      #qb-boot .qb-boot__name {
        font-size: 15px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #7b8393;
        /* O nome entra depois da marca: a marca e o que se reconhece, e as duas
           chegando juntas competem pela atencao no mesmo instante. */
        animation: qb-boot-in 520ms 140ms ease both;
      }
      #qb-boot .qb-boot__mark {
        animation: qb-boot-in 460ms ease both;
      }
      /*
        Uma barra que RESPIRA, e nao uma que finge progresso. Nao ha porcentagem
        honesta para mostrar: ler a pasta e gerar miniaturas nao tem etapas
        contaveis, e uma barra que enche sozinha seria mentira desenhada.
      */
      #qb-boot .qb-boot__pulse {
        width: 132px;
        height: 2px;
        border-radius: 2px;
        background: #262a33;
        overflow: hidden;
      }
      #qb-boot .qb-boot__pulse::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #2b6ef0, #58a6ff);
        animation: qb-boot-slide 1150ms ease-in-out infinite;
      }
      @keyframes qb-boot-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes qb-boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }
      /* Quem pediu menos movimento no sistema nao ganha animacao nenhuma; a
         tela continua legivel e correta parada. */
      @media (prefers-reduced-motion: reduce) {
        #qb-boot .qb-boot__mark,
        #qb-boot .qb-boot__name {
          animation: none;
        }
        #qb-boot .qb-boot__pulse::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
