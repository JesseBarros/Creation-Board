appId: com.creationboard.app
productName: Creation Board
copyright: Copyright © 2026 Jessé Barros

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # Sem assinatura de codigo: um certificado de assinatura custa caro e este e um
  # projeto aberto. A consequencia e visivel e vale avisar quem for instalar: o
  # SmartScreen mostra "O Windows protegeu o computador" na primeira execucao do
  # instalador, e e preciso clicar em "Mais informacoes" e "Executar assim mesmo".
  # Nao e um aviso sobre o conteudo do programa -- e sobre a falta de assinatura.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Creation Board
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}

# Sem publish: build totalmente local, nada de auto-update.
publish: null
